<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
        </header>

        <div class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="Enter city name..."
                class="search-input"
            />
            <button id="searchBtn" class="search-btn">Search</button>
        </div>

        <div id="loadingSpinner" class="loading hidden">
            <div class="spinner"></div>
        </div>

        <div id="errorMessage" class="error-message hidden"></div>

        <div id="weatherContainer" class="weather-container hidden">
            <div class="current-weather">
                <div class="city-info">
                    <h2 id="cityName"></h2>
                    <p id="currentDate"></p>
                </div>
                <div class="weather-main">
                    <div class="temperature-section">
                        <div id="temperature" class="temperature"></div>
                        <div id="weatherDescription" class="description"></div>
                    </div>
                    <img id="weatherIcon" src="" alt="Weather icon" class="weather-icon">
                </div>
                <div class="weather-details">
                    <div class="detail">
                        <span class="label">Feels Like</span>
                        <span id="feelsLike" class="value"></span>
                    </div>
                    <div class="detail">
                        <span class="label">Humidity</span>
                        <span id="humidity" class="value"></span>
                    </div>
                    <div class="detail">
                        <span class="label">Wind Speed</span>
                        <span id="windSpeed" class="value"></span>
                    </div>
                    <div class="detail">
                        <span class="label">Pressure</span>
                        <span id="pressure" class="value"></span>
                    </div>
                    <div class="detail">
                        <span class="label">Visibility</span>
                        <span id="visibility" class="value"></span>
                    </div>
                    <div class="detail">
                        <span class="label">UV Index</span>
                        <span id="uvIndex" class="value"></span>
                    </div>
                </div>
            </div>

            <div class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div id="forecastContainer" class="forecast-container"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
